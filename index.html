<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ritmo</title>
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="ornrarv.css">
<style>
/* Ritmo × ORNRARV, versione semplice: un solo carattere (quello di sistema dell'iPhone), quattro misure, orari grandi e senza zeri iniziali.
   Prima versione sobria: in alto il paesaggio del mese settale con il codice del giorno; sotto, carta chiara,
   liste con righe sottili e un solo colore per area (spento), usato solo come barretta o puntino. Inchiostro per le azioni. */
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1E2024; --muted:#6C6F76; --line:#E5E2DA; --soft:#F0EDE6;
  --go:#1E2024; --go-ink:#FFFFFF;
  --ner:#3F7A5A; --stu:#44609A; --cor:#B06A40; --soc:#965172; --imp:#6D6394; --pau:#BDB6A7; --via:#8D9AA2;
  --pau-t:#F3EFE4; --bad:#B04A3C; --warn:#9A6B1F;
  --f-disp:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141518; --card:#1C1D21; --ink:#ECEBE7; --muted:#A09F9A; --line:#2C2D32; --soft:#232428; --go:#ECEBE7; --go-ink:#141518;
  --ner:#6FB58E; --stu:#8EA6DA; --cor:#D69468; --soc:#CE8AAA; --imp:#A99FD2; --pau:#5E5A52; --via:#7C8990; --pau-t:#24231F; --bad:#E07B6E; --warn:#D6A55A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --card:#1C1D21; --ink:#ECEBE7; --muted:#A09F9A; --line:#2C2D32; --soft:#232428; --go:#ECEBE7; --go-ink:#141518;
  --ner:#6FB58E; --stu:#8EA6DA; --cor:#D69468; --soc:#CE8AAA; --imp:#A99FD2; --pau:#5E5A52; --via:#7C8990; --pau-t:#24231F; --bad:#E07B6E; --warn:#D6A55A; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:400;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--stu);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.15;text-wrap:balance;font-weight:700;letter-spacing:-.02em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.06rem;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
.muted{color:var(--muted)} .small{font-size:.86rem}

[data-cat="nerina"]{--c:var(--ner)} [data-cat="studio"]{--c:var(--stu)} [data-cat="corpo"]{--c:var(--cor)}
[data-cat="sociale"]{--c:var(--soc)} [data-cat="impegno"],[data-cat="ripetizione"]{--c:var(--imp)}
[data-cat="pausa"]{--c:var(--pau)} [data-cat="viaggio"]{--c:var(--via)} [data-cat="libero"]{--c:var(--line)}
[data-cat="scadenza"]{--c:var(--bad)} [data-cat="promemoria"],[data-cat="festa"]{--c:var(--muted)}

.app{position:relative;max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px}

/* testata */
.top-r{position:absolute;z-index:6;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center}
.pill,.iconbtn{border:0;cursor:pointer;color:var(--h-ink,#fff);background:color-mix(in srgb,var(--h-ink,#fff) 14%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:600}
.pill svg{width:15px;height:15px;color:#F3C77A}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.hero{position:relative;overflow:hidden;isolation:isolate;margin:calc(-18px - env(safe-area-inset-top,0px)) calc(-1 * max(18px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(18px,env(safe-area-inset-left,0px)));min-height:calc(232px + env(safe-area-inset-top,0px));background:var(--h-bg);color:var(--h-ink)}
.hero.short{min-height:calc(200px + env(safe-area-inset-top,0px))}
.hero > .scene{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--h-bg) 0%,color-mix(in srgb,var(--h-bg) 88%,transparent) 38%,color-mix(in srgb,var(--h-bg) 25%,transparent) 64%,transparent 80%)}
.hero .season-fx{position:absolute;inset:0;pointer-events:none;z-index:1}
.hero-text{position:relative;z-index:2;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;display:flex;flex-direction:column;gap:6px}
.kick{font-size:.9rem;opacity:.85;padding-right:140px}
.hero h1{font-size:1.85rem;line-height:1.08}
.code-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code{display:inline-flex;gap:3px;align-items:center}
.code b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--f-disp);background:var(--lc);color:var(--lfg)}
.code i{font-style:normal;opacity:.4}
.code.sm b{width:19px;height:19px;font-size:.72rem}
.fict{font-size:.95rem;font-weight:500;opacity:.9}
.emblem{display:inline-flex;align-items:center;gap:8px;margin-top:2px;align-self:flex-start}
.em-icon{width:38px;height:38px;flex:none;border-radius:10px;padding:3px;background:color-mix(in srgb,#FBF9F3 90%,var(--lc))}
.em-text{display:flex;flex-direction:column;line-height:1.2}
.em-text span{display:none}
.em-text b{font-size:.92rem;font-weight:600}
.em-text small{display:none}

/* sezioni e liste */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.list-h{margin-bottom:-8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tint{background:var(--card)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lbl{font-size:1.02rem;font-weight:500;overflow-wrap:anywhere}
.sub{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.eyebrow{font-size:.84rem;font-weight:600;color:var(--muted)}
.eyebrow[data-cat]{color:var(--c)}
.status{font-size:.95rem}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc,var(--ner));border-radius:9px;transition:width .4s}
.late-box{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--warn)}
.sec.warn h3{color:var(--bad)}
.rows{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rows .r{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.rows .r + .r{border-top:1px solid var(--line)}
.rows .r.gone{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.grow{flex:1 1 140px;min-width:0}
.badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.badge svg{display:none}

/* adesso */
.now{display:flex;flex-direction:column;gap:6px;padding:16px 16px 16px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);border-left:4px solid var(--c,var(--ink))}
.now .big{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.now .when{font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.now .btns{margin-top:6px}

/* bottoni */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.go,.btn.c{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:9px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* energia */
.erow{display:grid;grid-template-columns:4rem minmax(0,1fr);gap:10px;align-items:center}
.erow > span{font-size:.92rem}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scale-l{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.meters{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:.9rem}
.meter{height:6px;border-radius:99px;background:var(--line);position:relative}
.meter i{display:block;height:100%;border-radius:99px;background:var(--c)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.4;text-decoration:none}
.hint{display:flex;flex-direction:column;gap:8px;font-size:.92rem;padding:12px 14px;border-radius:var(--r);background:var(--pau-t)}

/* giornata */
.tl{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tl > li + li{border-top:1px solid var(--line)}
.tl-item{display:grid;grid-template-columns:3.3rem 3px minmax(0,1fr) auto;gap:12px;align-items:center;background:none;border:0;padding:14px 12px 14px 14px;cursor:pointer;text-align:left;width:100%}
.tl-item .time{display:flex;flex-direction:column;line-height:1.2;font-variant-numeric:tabular-nums}
.tl-item .time b{font-size:1.06rem;font-weight:600;letter-spacing:-.01em}
.tl-item .time span{color:var(--muted);font-size:.8rem;margin-top:1px}
.tl-item .bar{align-self:stretch;border-radius:3px;background:var(--c);min-height:22px}
.tl-item .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tl-item.done .lbl{text-decoration:line-through;color:var(--muted)}
.tl-item.done .bar{opacity:.35}
.tl-item.now{background:var(--soft)}
.tl-item.late .time b{color:var(--warn)}
.late-act{font-size:.82rem;color:var(--warn);margin-top:2px}
.late-act .link{color:var(--warn)}
.chk{width:32px;height:32px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);background:none;display:grid;place-items:center;cursor:pointer;padding:0;transition:background .2s,border-color .2s}
.chk svg{width:16px;height:16px;opacity:0;color:var(--bg)}
.chk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.chk[aria-pressed="true"] svg{opacity:1}
.tl-mini{display:flex;gap:12px;align-items:center;font-size:.86rem;color:var(--muted);padding:8px 14px;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.tl-mini .t{width:3.3rem;flex:none}
.tl-mini.meal{width:100%;border:0;font:inherit;text-align:left;cursor:pointer}
.tl-mini.meal .grow{flex:1}
.tl-mini.meal .chev{font-size:.8rem;color:var(--muted);opacity:.8}
.hero-sum{font-size:1rem;line-height:1.42;margin-top:8px;max-width:34ch;text-shadow:0 0 8px var(--h-bg),0 0 2px var(--h-bg)}
.tl-mini.free{color:color-mix(in srgb,var(--muted) 80%,var(--bg))}
.tl.compact .tl-item{cursor:default}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}

.ner-card{text-decoration:none}
.ner-card .t{font-family:var(--f-disp);font-weight:600;font-size:1.1rem}
.ner-card ul{margin:0;padding-left:1.1em;font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.ner-card .go{font-size:.88rem;font-weight:600}
.rito .rh{display:flex;gap:12px;align-items:center}
.rito .ri{width:40px;height:40px;flex:none}
.rito textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-height:60px;resize:vertical}

/* sposta */
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer}
.slot b{font-weight:600;font-size:1.02rem}
.slot.rec{border:1.5px solid var(--ink)}
.slot.rec .eyebrow{color:var(--ner)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* settimana */
.wrow{display:flex;flex-direction:column;gap:7px;background:none;border:0;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.wlist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wlist > .wrow + .wrow{border-top:1px solid var(--line)}
.wrow-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.wrow-h .day{font-weight:600;white-space:nowrap}
.wrow-h .lvl{white-space:nowrap;font-size:.84rem}
.wrow-h .nn{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-size:.8rem;color:var(--muted);white-space:nowrap}
.lvl[data-l="4"],.lvl[data-l="5"]{color:var(--warn)}
.strip{position:relative;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.strip i{position:absolute;top:0;bottom:0;background:var(--c)}
.strip i[data-cat="pausa"],.strip i[data-cat="viaggio"]{opacity:.5}
.axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);padding:0 14px;margin-bottom:-10px}
.bal{display:grid;grid-template-columns:5.6rem minmax(0,1fr) auto;gap:10px 12px;align-items:center;font-size:.92rem}
.bal .v{text-align:right;font-size:.84rem;white-space:nowrap;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:7.2rem minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 0}
.list li + li{border-top:1px solid var(--line)}
.list .d{font-size:.84rem;color:var(--muted)}

/* mese settale */
.mnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.og{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.og-head,.og-row{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr))}
.og-head{border-bottom:1px solid var(--line)}
.og-head span{padding:8px 0 6px;text-align:center;font-weight:700;font-size:.95rem;color:var(--lc,var(--muted))}
.og-head span small{display:block;font:400 .6rem var(--f-body);color:var(--muted)}
.og-wl{display:grid;place-items:center;border-top:1px solid var(--line)}
.og-wl b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 .82rem var(--f-disp);color:var(--wc);border:1.5px solid var(--wc)}
.og-c{position:relative;min-height:60px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:none;padding:6px 5px 12px;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:1px;cursor:pointer;text-align:left;color:var(--ink)}
.og-c .n{font-size:1rem;font-weight:600;line-height:1}
.og-c .dt{font-size:.6rem;color:var(--muted)}
.og-c.past{opacity:.4}
.og-c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.og-c .ld{position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:9px;background:var(--line);overflow:hidden}
.og-c .ld i{display:block;height:100%;border-radius:9px;background:var(--muted)}
.og-c .ld i[data-l="4"]{background:var(--warn)} .og-c .ld i[data-l="5"]{background:var(--bad)}
.og-c .mdots{position:absolute;top:6px;right:4px;display:flex;flex-direction:column;gap:2px}
.og-c .mdots i{width:5px;height:5px;border-radius:50%;background:var(--c)}

/* barra in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.fab{position:fixed;z-index:11;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--go);color:var(--go-ink);cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .18);display:grid;place-items:center}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px}

/* fogli */
.sheet-wrap{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgb(20 20 24 / .4);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 2px}
.sheet .x{position:sticky;top:0;align-self:flex-end;margin-bottom:-44px;z-index:2}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.check{display:flex;gap:12px;align-items:center;font-size:.95rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.big-ok{font-size:2.2rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.lil.still .dr{stroke-dashoffset:0}.lil.still .pp,.lil.still .fi{opacity:1;transform:none}.lil.still .n-spin{opacity:1;transform:rotate(40deg)}.lil.still .r2-raise,.lil.still .r3-peri{transform:none}

/* benvenuto */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.logo{width:72px;height:72px;border-radius:18px}
.welcome h1{font-size:2.1rem}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}
.chk.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ===== Ritmo 2: più grande, più giocoso, meno testo (stile percorso) ===== */
:root{--ok:#2F9E5B;--ok-d:#22784A;--ok-t:color-mix(in srgb,#2F9E5B 14%,var(--card))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok:#3FB96E;--ok-d:#2A8A50}}
html{scroll-behavior:smooth}
body{font-size:17px;overscroll-behavior-y:auto}
h2{font-size:1.45rem} h3{font-size:1.18rem}
.small{font-size:.95rem} .sub{font-size:.95rem} .eyebrow{font-size:.95rem;font-weight:700}
.lbl{font-size:1.12rem;font-weight:600}
.card{border-radius:20px;padding:16px 18px}
.rows{border-radius:18px}
.sec{gap:12px}
#view{gap:16px}
.kick{font-size:1rem}
button:active{transform:scale(.97)}
/* bottoni a rilievo */
.btn{border-radius:14px;border-width:2px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s,background .15s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.go,.btn.c{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.btn.go:active{box-shadow:0 0 0 var(--ok-d)}
.btn.ghost{box-shadow:none}
.btn.small{border-radius:12px;font-size:.95rem;min-height:40px}
.big3{min-height:56px;font-size:1.12rem;font-weight:800;padding:12px 22px;flex:1}
.big3 svg{width:22px;height:22px}
/* intestazione: anello e stato */
.hstat{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 14px;align-items:center;margin-top:10px}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .r0{stroke:color-mix(in srgb,var(--h-ink) 20%,transparent)}
.ring .r1{stroke:#46C27A;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.9,.3,1)}
.ring .re{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem}
.re.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.4)}100%{transform:scale(1)}}
.hs-t{display:flex;flex-direction:column;line-height:1.15;text-shadow:0 0 10px var(--h-bg)}
.hs-t b{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.hs-t span{font-size:1.08rem;font-weight:600;opacity:.88;font-variant-numeric:tabular-nums;margin-top:2px}
.hs-c{grid-column:1/-1;margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pillc{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;font-size:1rem;font-weight:700;background:color-mix(in srgb,var(--c,var(--muted)) 14%,var(--card));font-variant-numeric:tabular-nums}
.pillc i{font-style:normal}
.hero .pillc{background:color-mix(in srgb,var(--h-ink) 15%,transparent);color:var(--h-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill{font-size:.95rem;padding:7px 13px}
/* adesso */
.now{gap:8px;padding:18px;border-radius:24px;border:2px solid color-mix(in srgb,var(--c,var(--ink)) 30%,var(--card));border-left-width:2px;background:color-mix(in srgb,var(--c,var(--ink)) 9%,var(--card))}
.now.empty{align-items:flex-start}
.now-h{display:flex;align-items:center;gap:10px}
.now-e{font-size:2.1rem;line-height:1}
.now .eyebrow{font-size:1rem;color:var(--c,var(--muted))}
.now .big{font-size:1.85rem;font-weight:800}
.now .when{font-size:1.12rem;font-weight:600}
.tbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--card));overflow:hidden}
.tbar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .6s}
.now .btns{margin-top:8px;flex-wrap:nowrap}
/* strisce di avviso */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 16px;cursor:pointer;font-size:1.12rem;box-shadow:0 3px 0 var(--line)}
.banner:active{transform:translateY(3px);box-shadow:none}
.banner .be{font-size:1.7rem;line-height:1}
.banner .chev{font-size:1rem;font-weight:700;color:var(--muted)}
.banner.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:color-mix(in srgb,var(--warn) 35%,var(--card))}
.banner.warn .chev{color:var(--warn)}
.banner.ok{background:var(--ok-t);border-color:color-mix(in srgb,var(--ok) 35%,var(--card))}
/* carte da anticipare, scorrono di lato */
.cards-x{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cards-x::-webkit-scrollbar{display:none}
.acard{flex:0 0 min(72%,240px);scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:20px;border:2px solid color-mix(in srgb,var(--c) 30%,var(--card));background:color-mix(in srgb,var(--c) 8%,var(--card))}
.acard .ae{font-size:1.8rem}
.acard b{font-size:1.1rem}
.acard .btns{margin-top:6px;flex-wrap:nowrap}
.acard .btn.go{flex:1}
/* il percorso */
.tl{background:none;border:0;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:4px}
.tl > li{position:relative}
.tl > li + li{border-top:0}
.tl > li::before{content:'';position:absolute;left:calc(6px + 3.6rem + 12px + 22px);top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--line);border-radius:4px;z-index:0}
.tl > li:first-child::before{top:50%}
.tl > li:last-child::before{bottom:50%}
.tl > li.ok::before{background:var(--ok)}
.tl-item{grid-template-columns:3.6rem 44px minmax(0,1fr);gap:12px;padding:8px 6px;border-radius:18px;position:relative;z-index:1}
.tl-item .time b{font-size:1.12rem}
.tl-item .time span{font-size:.88rem}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;line-height:1;background:var(--card);border:3px solid var(--c);padding:0;position:relative;z-index:1;justify-self:center;transition:transform .15s,background .2s,border-color .2s}
.node .ck{display:none;color:#fff}
.node .ck svg{width:22px;height:22px}
.tl-item.done .node{background:var(--ok);border-color:var(--ok)}
.tl-item.done .node .em{display:none}
.tl-item.done .node .ck{display:grid}
.tl-item.done .lbl{text-decoration:none;color:var(--muted)}
.tl-item.now{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.tl-item.now .node{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.tl-item.late .node{border-style:dashed;border-color:var(--warn)}
.tl-item.late .time b{color:var(--warn)}
.node.pop{animation:popn .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes popn{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tl-item.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--ok-t)}100%{background:transparent}}
.late-chip{align-self:flex-start;margin-top:4px;border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.95rem;background:color-mix(in srgb,var(--warn) 15%,var(--card));color:var(--warn);cursor:pointer}
.tl-mini{display:grid;grid-template-columns:3.6rem 44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:4px 6px;background:none;font-size:1rem;position:relative;z-index:1;color:var(--muted)}
.tl-mini .time b{font-size:1rem;font-weight:600}
.node.sm{width:32px;height:32px;font-size:1rem;border:0;background:var(--soft)}
.mini.free .node.sm{background:var(--bg);outline:2px dashed var(--line)}
.tl-mini.meal{border-radius:14px}
.tl-mini.meal .chev{font-size:.95rem}
/* come stai */
.erow{grid-template-columns:2.2rem minmax(0,1fr)}
.erow > .eic{font-size:1.6rem;text-align:center}
.scale.faces button{height:50px;font-size:1.55rem;border-radius:14px;border-width:2px;transition:transform .15s,background .15s}
.scale.faces button[aria-pressed="true"]{background:var(--ok-t);border-color:var(--ok);transform:scale(1.08);color:inherit}
.hint{font-size:1.02rem;border-radius:18px}
/* nuovo impegno */
.bigin{font-size:1.3rem;font-weight:600;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);width:100%;min-width:0}
.bigin:focus{outline:none;border-color:var(--ok)}
.bigin.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tiles button span{font-size:1.75rem}
.tiles button[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-t);box-shadow:0 3px 0 var(--ok)}
.lab{font-size:1rem;font-weight:700;margin-top:4px}
.ev-when{display:flex;flex-direction:column;gap:10px}
.mini-in{border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card);font-size:16px;min-height:42px}
.mini-in.wide{width:100%}
.chip{min-height:42px;font-size:1rem;border-radius:12px;border-width:2px}
.chip[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
/* pulsante + */
.fab{width:60px;height:60px;background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d),0 8px 20px rgb(0 0 0 / .18);display:flex;align-items:center;justify-content:center;gap:6px;bottom:calc(84px + env(safe-area-inset-bottom,0px));transition:width .25s,border-radius .25s}
.fab span{display:none;font-weight:800;font-size:1.05rem}
.fab.ext{width:auto;padding:0 22px 0 18px;border-radius:999px}
.fab.ext span{display:inline}
.fab.ext.shrink{width:60px;padding:0;border-radius:50%}
.fab.ext.shrink span{display:none}
.x.btn{width:44px;padding:0;font-size:1.2rem;border-radius:50%}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ok-d)}
/* barra in basso */
.tabbar button{font-size:.8rem}
.tabbar button[aria-selected="true"]{color:var(--ok)}
.tabbar button[aria-selected="true"] svg{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
/* avvisi brevi e festa */
.toast{white-space:nowrap;font-size:1.1rem;font-weight:800;padding:13px 22px;border-radius:999px;bottom:calc(158px + env(safe-area-inset-bottom,0px));box-shadow:0 8px 24px rgb(0 0 0 / .22)}
.toast.on{animation:tpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tpop{0%{transform:translateX(-50%) scale(.7)}100%{transform:translateX(-50%) scale(1)}}
.conf{position:fixed;width:10px;height:10px;border-radius:2px;z-index:60;pointer-events:none}
.party{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s;transition:opacity .25s}
.party.out{opacity:0}
.party-in{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.party .pe{font-size:5.5rem;animation:bump .7s cubic-bezier(.3,1.6,.5,1)}
.party b{font-size:1.9rem;font-weight:800}
.party span:last-child:not(.pe){font-size:1.15rem;color:var(--muted);font-weight:600}
/* fogli e scorrimento */
.sheet{overscroll-behavior:contain;border-radius:24px 24px 0 0;will-change:transform}
.grab{width:46px;height:5px;margin:6px auto 4px}
.field label{font-size:.95rem}
/* entrata delle schede */
.enter > *{animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
.enter > *:nth-child(2){animation-delay:.04s}.enter > *:nth-child(3){animation-delay:.08s}.enter > *:nth-child(4){animation-delay:.12s}
.enter > *:nth-child(5){animation-delay:.16s}.enter > *:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
/* settimana */
.wrow-h .lvl,.lvl{font-size:.95rem}
.bal{grid-template-columns:7.4rem minmax(0,1fr) auto;font-size:1rem}
.bal .v{font-size:.95rem;font-weight:700;color:var(--ink)}
.meter{height:10px}
.strip{height:10px}

/* ===== icone ===== */
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
.ic.flip{transform:scaleX(-1)}
.ici{display:inline-flex;align-items:center;color:var(--c,inherit)}
.ih{display:flex;align-items:center;gap:8px}
.node .em{display:grid;place-items:center;color:var(--c)}
.node .em .ic{width:22px;height:22px;stroke-width:2}
.node .ck .ic{width:24px;height:24px;stroke-width:2.8}
.tl-item.done .node .ck{color:#fff}
.node.sm .ic{width:17px;height:17px;color:var(--muted)}
.tl-mini.sonno{color:var(--muted)}
.tl-mini.sonno .node.sm{background:color-mix(in srgb,var(--stu) 12%,var(--card))}
.tl-mini.sonno .node.sm .ic{color:var(--stu)}
.tl-mini .chev .ic{width:17px;height:17px}
.now-e{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--c,var(--ink)) 16%,var(--card));color:var(--c,var(--ink))}
.now-e .ic{width:28px;height:28px;stroke-width:2}
.now-e .lvlb{width:30px;height:20px}
.banner .be{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--soft)}
.banner .be .ic{width:24px;height:24px;stroke-width:2.1}
.banner.warn .be{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.banner.ok .be{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.banner .chev{display:inline-flex;align-items:center;gap:4px}
.pillc i{display:inline-flex;color:var(--c,var(--muted))}
.pillc i .ic{width:17px;height:17px;stroke-width:2.1}
.hero .pillc i{color:var(--h-ink)}
.ring .re .ic{width:34px;height:34px;stroke-width:2;color:var(--mc,#46C27A)}
.party .pe{color:#E2A63B}
.party .pe .ic{width:96px;height:96px;stroke-width:1.6}
.toast .ici .ic{width:20px;height:20px;stroke-width:2.2;color:#7EE0A6}
.toast{display:flex;align-items:center;gap:8px}
.tiles button span{display:grid;place-items:center}
.tiles button span .ic{width:28px;height:28px;stroke-width:1.9}
.tiles button[aria-pressed="true"] span{color:var(--ok)}
.btn .ic{width:20px;height:20px;stroke-width:2.3}
.btn.small .ic{width:17px;height:17px}
.sub.ok{color:var(--ok);display:flex;align-items:center;gap:4px;font-weight:600}
.sub.ok .ic{width:15px;height:15px}
.eic{display:grid;place-items:center;color:var(--muted)}
.eic .ic{width:24px;height:24px}
.lvlb{width:26px;height:16px;flex:none}
.lvlb rect{fill:var(--line)}
.lvlb rect.on{fill:var(--ok)}
.lvlb.warn rect.on{fill:var(--warn)}
.scale.faces button{display:grid;place-items:center}
.scale.faces button .lvlb{width:30px;height:20px}
.lvl{display:inline-flex;align-items:center;gap:6px}
.bl{display:inline-flex;align-items:center;gap:7px}
.bl .ic{color:var(--c);width:19px;height:19px}
.ih .ici .ic{width:20px;height:20px}
.acard .ae{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
.acard .ae .ic{width:22px;height:22px}
.x.btn .ic{width:18px;height:18px}
.pill .ici .ic{width:17px;height:17px;color:#F2B14C}
/* ===== calendario ===== */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:11px;padding:9px 0;font-weight:700;font-size:1rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.mtitle{font-size:1.3rem;font-weight:800}
.iconbtn2{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn2 .ic{width:20px;height:20px;stroke-width:2.4}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .cw{text-align:center;font-size:.85rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.cd{aspect-ratio:1/1.05;border:0;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0;transition:transform .12s,background .15s}
.cd .n{font-size:1.08rem;font-weight:700;font-variant-numeric:tabular-nums}
.cd.out{background:none;opacity:.45}
.cd.past .n{color:var(--muted)}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{background:var(--ok);color:#fff}
.cd.sel .n{color:#fff}
.cd.sel .cdots i{background:#fff!important}
.cdots{display:flex;gap:3px;height:6px}
.cdots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.dpanel{gap:12px;animation:rise .3s cubic-bezier(.2,.9,.3,1)}
.dp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dp-h h3{font-size:1.3rem}
.dp-free{font-weight:700;color:var(--ok);font-size:1.05rem}
.dp-lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fxlist{display:flex;flex-direction:column;gap:2px;padding:0}
.fxlist.card{padding:6px}
.fxrow{display:grid;grid-template-columns:34px auto minmax(0,1fr);gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 6px;border-radius:12px;cursor:pointer;font-size:1.02rem;width:100%}
.fxrow:active{background:var(--soft)}
.fxrow .fxi{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 15%,var(--card));color:var(--c)}
.fxrow .fxi .ic{width:19px;height:19px}
.fxrow .t{font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.free{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));color:var(--ok)}
.chip.free[aria-pressed="true"]{color:#fff}
.chip.soft{font-weight:600;background:var(--soft);border-color:transparent}
.dstrip-w{display:flex;flex-direction:column;gap:3px}
.dstrip{position:relative;height:30px;border-radius:10px;background:color-mix(in srgb,var(--ok) 9%,var(--card));border:1.5px solid var(--line);overflow:hidden}
.dstrip.pick{cursor:crosshair;height:40px}
.dstrip i{position:absolute;top:0;bottom:0}
.dstrip i.sl{background:repeating-linear-gradient(135deg,var(--soft) 0 4px,var(--line) 4px 6px)}

<script src="ornrarv-lib.js"></script>
<script>
(() => {
'use strict';
/* Regole della settimana tipo. Il file dei dati (data.enc.json) può sovrascriverle. */
const DEF = {
  giorno: { inizio: '09:00', inizioDomenica: '10:00', fineLavoro: '23:30' },
  /* Sonno: 8h30 a notte; a letto di base a mezzanotte, più tardi se la sera finisce tardi, prima se la mattina dopo si parte presto. */
  sonno: { ore: 510, letto: '00:00', sera: 45, mattina: 30, primaImpegno: 45 },
  /* Pasti da 15 minuti, messi ogni giorno nel posto migliore della loro fascia; allenamenti almeno 1h30 dopo un pasto. */
  pasti: { min: 15, pranzo: { ideale: '13:00', da: '12:00', a: '14:30' }, cena: { ideale: '20:00', da: '19:00', a: '21:30' }, merenda: { dopoPranzo: 120, primaCena: 90 } },
  allenamento: { dopoPasto: 90 },
  nerina: { durata: 120, feriale: 3, sabato: 3, domenica: 1, b3Feriale: '16:00', b3Weekend: '13:45' },
  studio: {
    '1': [{ m: 'KRR', min: 180 }, { m: 'Fisica', min: 60 }],
    '2': [{ m: 'Computer Programming', min: 120 }, { m: 'Analisi', min: 120 }],
    '3': [{ m: 'Computational Logic', min: 180 }, { m: 'Computer Programming', min: 60 }],
    '4': [{ m: 'KRR', min: 180 }],
    '5': [{ m: 'Computational Logic', min: 120 }, { m: 'Analisi', min: 120 }]
  },
  palestra: { volte: 3, durata: 150, dopo: '14:00', fineIdeale: '20:00' },
  karate: { giorni: [2, 4], inizio: '20:00', fine: '22:00' },
  sociale: { biblioteca: 5, viaggio: 30, uscitaGiorno: 6, uscitaInizio: '21:00', uscitaFine: '00:30', obiettivo: 2 },
  soglia: { mente: 9 },
  cruscotto: 'https://claude.ai/artifact/GC8MBwH6aJJCGhLPCW3Bpf'
};
const NB = [
  { key: 'n1', label: 'Nerina · B1', sub: 'Leggi e prova il lavoro della notte' },
  { key: 'n2', label: 'Nerina · B2', sub: 'Lavoro a mano: account, prove, documenti' },
  { key: 'n3', label: 'Nerina · B3', sub: 'Prepara e lancia il prompt della notte' }
];
const TASK_TIPI = ['impegno', 'ripetizione', 'sociale'];
const CATN = { nerina: 'Lavoro · Nerina', studio: 'Scuola', corpo: 'Allenamento', sociale: 'Relazioni', impegno: 'Impegno', ripetizione: 'Ripetizione' };
const WD = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const WDS = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
const MO = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MOS = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];

/* S.file = dati dal file cifrato; S.miei, S.nascosti, S.giorni, S.settimane = stato sul telefono */
const S = { cfg: null, nerina: {}, file: [], miei: [], nascosti: [], giorni: {}, settimane: {}, rotte: {}, pasti: {}, eventi: [], versione: null };
const rebuildEvents = () => { const hid = new Set(S.nascosti); S.eventi = [...S.file.filter((e) => !hid.has(e.id)).map((e) => ({ ...e, src: 'file' })), ...S.miei]; };

/* ---------- tempo ---------- */
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const dowOf = (s) => parseISO(s).getDay();
const dayDiff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const mondayOf = (s) => addDays(s, -((dowOf(s) + 6) % 7));
const toMin = (t, after) => { if (!t) return null; const [hh, mm] = String(t).split(':').map(Number); let v = hh * 60 + (mm || 0); if (after != null && v < after) v += 1440; return v; };
const fmt = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + pad(m % 60); };
const hm = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const dur = (m) => { m = Math.round(m); const hh = Math.floor(m / 60), r = m % 60; return hh ? (r ? `${hh}h${pad(r)}` : `${hh}h`) : `${r} min`; };
const hrs = (x) => { const v = Math.round(x * 2) / 2; return (Number.isInteger(v) ? v : v.toFixed(1).replace('.', ',')) + 'h'; };
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const dayLong = (s) => { const d = parseISO(s); return `${cap(WD[d.getDay()])} ${d.getDate()} ${MO[d.getMonth()]}`; };
const dayShort = (s) => { const d = parseISO(s); return `${WDS[d.getDay()]} ${d.getDate()}`; };
const dateShort = (s) => { const d = parseISO(s); return `${d.getDate()} ${MOS[d.getMonth()]}`; };
function nowLogical() { const n = new Date(); const l = new Date(n.getTime() - 4 * 3600e3); return { date: iso(l), min: n.getHours() * 60 + n.getMinutes() + (n.getHours() < 4 ? 1440 : 0), hour: n.getHours() }; }
const nextSunday = (s) => addDays(s, dowOf(s) === 0 ? 7 : 7 - dowOf(s));

function cfg() {
  const c = S.cfg; if (!c) return DEF;
  const out = { ...DEF };
  for (const k of Object.keys(c)) out[k] = (c[k] && typeof c[k] === 'object' && !Array.isArray(c[k]) && DEF[k] && k !== 'studio') ? { ...DEF[k], ...c[k] } : c[k];
  return out;
}
const eventsOn = (d) => S.eventi.filter((e) => e.data === d);
const evCat = (e) => e.tipo === 'sociale' ? 'sociale' : e.tipo === 'ripetizione' ? 'ripetizione' : 'impegno';
const evLen = (e) => e.inizio && e.fine ? toMin(e.fine, toMin(e.inizio)) - toMin(e.inizio) : (Number(e.durata) || 60);
const nerinaCount = (c, dow) => dow === 0 ? c.nerina.domenica : dow === 6 ? c.nerina.sabato : c.nerina.feriale;

function estLoad(d) {
  const c = cfg(), dow = dowOf(d);
  let x = nerinaCount(c, dow) * c.nerina.durata / 60;
  x += (c.studio[String(dow)] || []).reduce((a, s) => a + s.min, 0) / 60;
  for (const e of eventsOn(d)) if (TASK_TIPI.includes(e.tipo) && e.tipo !== 'sociale') x += evLen(e) / 60 * (e.tipo === 'ripetizione' ? 0.6 : 0.8);
  return x;
}
/* Minuti liberi che restano dopo pasti, impegni, Nerina, studio e (se è quel giorno) karate. */
function slack(d, kar) {
  const c = cfg(), dow = dowOf(d), st = S.giorni[d] || {};
  const z = c.sonno || DEF.sonno, wake = toMin(z.letto, 600) + z.ore - 1440;
  const D0 = Math.max(wake + z.mattina, dow === 0 ? toMin(c.giorno.inizioDomenica) : 0), D1 = toMin(z.letto, 600) - z.sera;
  const isK = kar === d;
  let free = D1 - D0 - 3 * ((c.pasti && c.pasti.min) || 15);
  if (isK) free -= toMin(c.karate.fine) - toMin(c.karate.inizio);
  for (const e of eventsOn(d)) {
    if (!TASK_TIPI.includes(e.tipo)) continue;
    if (e.inizio && !e.flessibile) { const s = toMin(e.inizio); free -= Math.max(0, Math.min(D1, s + evLen(e)) - Math.max(D0, s)); } else free -= evLen(e);
  }
  free -= nerinaCount(c, dow) * c.nerina.durata;
  const study = (c.studio[String(dow)] || []).reduce((a, s) => a + s.min, 0);
  free -= study;
  const bib = st.biblioteca !== undefined ? !!st.biblioteca : dow === c.sociale.biblioteca;
  if (bib && study) free -= 2 * c.sociale.viaggio;
  if (dow === c.sociale.uscitaGiorno && !(st.skip || {}).uscita) free -= Math.max(0, D1 - toMin(c.sociale.uscitaInizio));
  return free;
}
function eveningBusy(d, a, b) {
  return eventsOn(d).some((e) => e.inizio && !e.flessibile && TASK_TIPI.includes(e.tipo) && toMin(e.inizio) < b && toMin(e.inizio) + evLen(e) > a);
}
/* Sport della settimana: karate nella sera libera con più spazio; palestra nei 3 giorni con più tempo libero, non attaccati ad altro sport se si può. */
function weekPlan(mon) {
  const c = cfg(), ov = S.settimane[mon];
  const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(mon, i));
  let kar = null, gym = [];
  if (ov && 'karate' in ov) kar = ov.karate || null;
  else {
    const kS = toMin(c.karate.inizio) - 60, kE = toMin(c.karate.fine);
    const cands = days.filter((d) => c.karate.giorni.includes(dowOf(d)) && !eveningBusy(d, kS, kE));
    cands.sort((a, b) => (slack(b, b) - slack(a, a)) || (estLoad(a) - estLoad(b)) || (dowOf(b) - dowOf(a)));
    kar = cands[0] || null;
  }
  if (ov && Array.isArray(ov.palestra)) gym = ov.palestra.slice();
  else {
    const need = c.palestra.durata + 30;
    const sorted = days.filter((d) => d !== kar).sort((a, b) => (slack(b, kar) - slack(a, kar)) || (estLoad(a) - estLoad(b)) || a.localeCompare(b));
    const sport = new Set(kar ? [kar] : []);
    const adj = (d) => [...sport].some((x) => Math.abs(dayDiff(x, d)) === 1);
    const pick = (ok) => { for (const d of sorted) { if (gym.length >= c.palestra.volte) break; if (!gym.includes(d) && ok(d)) { gym.push(d); sport.add(d); } } };
    pick((d) => slack(d, kar) >= need && !adj(d));
    pick((d) => slack(d, kar) >= need);
    pick(() => true);
  }
  return { kar, gym: new Set(gym), auto: !ov };
}

/* Primo inizio e ultima fine degli impegni fissi di un giorno (impegni con orario, blocchi fissati, karate, uscita). */
function fixedSpan(d) {
  const c = cfg(), st = S.giorni[d] || {}, skip = st.skip || {}; let first = null, last = null;
  const take = (a, b) => { if (first == null || a < first) first = a; if (last == null || b > last) last = b; };
  for (const e of eventsOn(d)) if (e.inizio && !e.flessibile && TASK_TIPI.includes(e.tipo)) { const s = toMin(e.inizio); take(s, s + evLen(e)); }
  for (const x of (st.extra || [])) if (x.at && !skip[x.key]) { const s = toMin(x.at, 240); take(s, s + x.min); }
  if (weekPlan(mondayOf(d)).kar === d && !skip.karate) take(toMin(c.karate.inizio), toMin(c.karate.fine));
  if (dowOf(d) === c.sociale.uscitaGiorno && !skip.uscita) { const s = toMin(c.sociale.uscitaInizio); take(s, toMin(c.sociale.uscitaFine, s)); }
  return { first, last };
}
/* La notte dopo il giorno d: ora di letto (minuti di d, anche oltre le 24) e sveglia (minuti del giorno dopo). */
function night(d) {
  const z = cfg().sonno || DEF.sonno;
  let bed = toMin(z.letto, 600);
  const a = fixedSpan(d), b = fixedSpan(addDays(d, 1));
  if (a.last != null && a.last + 30 > bed) bed = a.last + 30;
  let wake = bed + z.ore - 1440;
  if (b.first != null && wake > b.first - z.primaImpegno) { wake = b.first - z.primaImpegno; bed = wake + 1440 - z.ore; }
  return { bed, wake };
}

/* ---------- il pianificatore della giornata ---------- */
function plan(date) {
  const c = cfg(), dow = dowOf(date), st = S.giorni[date] || {}, skip = st.skip || {}, fatti = st.fatti || {};
  const wk = weekPlan(mondayOf(date));
  const weekend = dow === 0 || dow === 6;
  const z = c.sonno || DEF.sonno, wake = night(addDays(date, -1)).wake, bedT = night(date).bed;
  const D0 = Math.max(wake + z.mattina, dow === 0 ? toMin(c.giorno.inizioDomenica) : 0);
  const D1 = bedT - z.sera;
  const items = [], unplaced = [], busy = [];
  const occupy = (a, b) => busy.push([a, b]);
  const add = (it) => { items.push(it); occupy(it.start, it.end); };
