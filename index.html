<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ritmo</title>
<meta name="theme-color" content="#F7F6FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Ritmo: un'app da tasca, chiara e colorata. Ogni area della vita ha il suo colore pieno e la sua tinta tenue:
   menta per Nerina, cielo per lo studio, mandarino per il corpo, fragola per le persone, lavanda per gli impegni, sole per i pasti. */
:root{
  --bg:#F7F6FB; --card:#FFFFFF; --ink:#211D3B; --muted:#716C8C; --line:#ECE9F5; --soft:#F0EEF8;
  --go:#FF5A5F; --go-ink:#FFFFFF;
  --ner:#14B87F; --ner-t:#DDF8EC; --stu:#4C6EF5; --stu-t:#E3E9FF; --cor:#FF7A1A; --cor-t:#FFEBDA;
  --soc:#F0408E; --soc-t:#FFE2EF; --imp:#8B5CF6; --imp-t:#EFE7FF; --pau:#F5B300; --pau-t:#FFF4CC; --via:#19A9C2; --via-t:#DAF5FA;
  --warm1:#FFF4CC; --warm2:#FFE2A8; --warm3:#FFC98A; --warm4:#FF9E80;
  --bad:#E5484D; --bad-t:#FFE5E5;
  --f-disp:"Fredoka","Avenir Next Rounded","SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Nunito","Avenir Next",-apple-system,system-ui,sans-serif;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131F; --card:#1F1C2D; --ink:#F2F0FA; --muted:#A7A2C0; --line:#2D293F; --soft:#272338;
  --go:#FF6B70; --go-ink:#1A0F12;
  --ner:#3DDC9F; --ner-t:#163A2D; --stu:#7D97FF; --stu-t:#1D2547; --cor:#FF9A4D; --cor-t:#3D2614; --soc:#FF6BAA; --soc-t:#3E1A2B;
  --imp:#AE8DFF; --imp-t:#2C2148; --pau:#FFCC40; --pau-t:#3A3010; --via:#4DD3EA; --via-t:#123540;
  --warm1:#3A3010; --warm2:#4A3510; --warm3:#5A3418; --warm4:#6B2A22; --bad:#FF7A7E; --bad-t:#3F1A1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131F; --card:#1F1C2D; --ink:#F2F0FA; --muted:#A7A2C0; --line:#2D293F; --soft:#272338;
  --go:#FF6B70; --go-ink:#1A0F12;
  --ner:#3DDC9F; --ner-t:#163A2D; --stu:#7D97FF; --stu-t:#1D2547; --cor:#FF9A4D; --cor-t:#3D2614; --soc:#FF6BAA; --soc-t:#3E1A2B;
  --imp:#AE8DFF; --imp-t:#2C2148; --pau:#FFCC40; --pau-t:#3A3010; --via:#4DD3EA; --via-t:#123540;
  --warm1:#3A3010; --warm2:#4A3510; --warm3:#5A3418; --warm4:#6B2A22; --bad:#FF7A7E; --bad-t:#3F1A1C; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;font-weight:600;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--stu);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.12;text-wrap:balance;font-weight:600}
h1{font-size:2rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
a{color:inherit}
.muted{color:var(--muted)} .small{font-size:.88rem}

[data-cat="nerina"]{--c:var(--ner);--t:var(--ner-t)} [data-cat="studio"]{--c:var(--stu);--t:var(--stu-t)} [data-cat="corpo"]{--c:var(--cor);--t:var(--cor-t)}
[data-cat="sociale"]{--c:var(--soc);--t:var(--soc-t)} [data-cat="impegno"],[data-cat="ripetizione"]{--c:var(--imp);--t:var(--imp-t)}
[data-cat="pausa"]{--c:var(--pau);--t:var(--pau-t)} [data-cat="viaggio"]{--c:var(--via);--t:var(--via-t)}
[data-cat="scadenza"]{--c:var(--bad);--t:var(--bad-t)} [data-cat="promemoria"],[data-cat="festa"]{--c:var(--muted);--t:var(--soft)}

.app{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello{font-size:.95rem;color:var(--muted);font-weight:700}
.top-r{display:flex;gap:8px;align-items:center}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:8px 12px;font-weight:800;font-size:.88rem;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.pill svg{width:18px;height:18px;color:var(--pau)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}
.week7{display:flex;gap:4px;margin-top:6px}
.week7 i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.week7 i.on{background:var(--ner)}

.card{background:var(--card);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tint{background:var(--t)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lbl{font-weight:800;overflow-wrap:anywhere}
.sub{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere;font-weight:600}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--muted))}

.btn{border:0;background:var(--soft);border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.btn:active,.tl-item:active,.chip:active,.mcell:active,.wrow:active,.pill:active{transform:scale(.97)}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.c{background:var(--c);color:#fff}
.btn.small{min-height:38px;padding:7px 12px;font-size:.9rem;border-radius:12px}
.btn.ghost{background:none;color:var(--muted)}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.badge{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.badge svg{width:21px;height:21px}
.badge.sm{width:30px;height:30px} .badge.sm svg{width:16px;height:16px}

/* adesso */
.now-card{gap:8px}
.now-head{display:flex;gap:12px;align-items:center}
.now-card .big{font-family:var(--f-disp);font-size:1.7rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.now-card .when{font-size:.95rem;color:var(--muted);font-weight:700}
.prog{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ner),#7BE0B5);border-radius:99px;transition:width .4s}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 div{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stat3 b{font-family:var(--f-disp);font-size:1.45rem;font-weight:600}
.stat3 span{font-size:.78rem;color:var(--muted)}

/* energia */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale button{height:46px;border-radius:14px;border:0;background:var(--soft);font-family:var(--f-disp);font-size:1.15rem;font-weight:600;cursor:pointer;transition:transform .12s,background .2s}
.scale button[aria-pressed="true"]{background:var(--c);color:#fff;transform:scale(1.05)}
.scale-l{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.meters{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:.9rem}
.meter{height:12px;border-radius:99px;background:var(--soft);position:relative}
.meter i{display:block;height:100%;border-radius:99px;background:var(--c)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink);opacity:.35;text-decoration:none}

/* giornata */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl-item{display:grid;grid-template-columns:3rem auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--t);border:0;border-radius:18px;padding:12px 12px 12px 14px;cursor:pointer;text-align:left;width:100%;transition:transform .12s,opacity .2s}
.tl-item .time{display:flex;flex-direction:column;line-height:1.25;font-size:.9rem}
.tl-item .time b{font-weight:800}
.tl-item .time span{color:var(--muted);font-size:.8rem}
.tl-item .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tl-item.done{opacity:.5}
.tl-item.done .lbl{text-decoration:line-through}
.tl-item.now{box-shadow:0 0 0 3px var(--c)}
.tl-item.late:not(.done){box-shadow:inset 0 0 0 2px var(--cor)}
.tl-item.soft{background:none;border:2px dashed var(--line);cursor:default}
.chk{width:40px;height:40px;border-radius:50%;border:3px solid var(--c);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,background .2s}
.chk svg{width:20px;height:20px;opacity:0;color:#fff;transition:opacity .2s}
.chk[aria-pressed="true"]{background:var(--c)}
.chk[aria-pressed="true"] svg{opacity:1}
.chk.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.tl-mini{display:flex;gap:10px;align-items:center;font-size:.86rem;color:var(--muted);padding:2px 6px}
.tl-mini .dot{width:22px;height:22px;border-radius:50%;background:var(--t);color:var(--c);display:grid;place-items:center}
.tl-mini .dot svg{width:13px;height:13px}
.tl-mini b{width:3rem;color:var(--ink);font-weight:800}
.tl.compact .tl-item{cursor:default;padding:10px 12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;color:var(--c);background:var(--t);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}

.ner-card{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--ner-t)}
.ner-card .t{font-family:var(--f-disp);font-weight:600;font-size:1.2rem}
.ner-card ul{margin:0;padding-left:1.1em;font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.ner-card .go{font-size:.9rem;font-weight:800;color:var(--ner)}
.warnbox{background:var(--bad-t);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.warnbox .it{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{background:var(--pau-t);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}

/* settimana */
.wrow{display:flex;flex-direction:column;gap:8px;background:var(--card);border:0;border-radius:18px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;transition:transform .12s}
.wrow-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.wrow-h .day{font-family:var(--f-disp);font-size:1.12rem;font-weight:600;min-width:3.6rem}
.wrow-h .nn{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.lvl[data-l="1"],.lvl[data-l="2"]{background:var(--ner-t);color:var(--ner)}
.lvl[data-l="3"]{background:var(--pau-t)}
.lvl[data-l="4"]{background:var(--cor-t);color:var(--cor)}
.lvl[data-l="5"]{background:var(--bad-t);color:var(--bad)}
.strip{position:relative;height:14px;border-radius:99px;background:var(--soft);overflow:hidden}
.strip i{position:absolute;top:0;bottom:0;background:var(--c);border-radius:99px;border:1.5px solid var(--card)}
.strip i[data-cat="pausa"],.strip i[data-cat="viaggio"]{opacity:.7}
.axis{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);padding:0 4px}
.bal{display:grid;grid-template-columns:5.6rem minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:.92rem}
.bal .v{text-align:right;font-size:.84rem;white-space:nowrap;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}

/* mese */
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mhead span{text-align:center;font-size:.76rem;font-weight:800;color:var(--muted)}
.mcell{min-height:60px;border-radius:14px;background:var(--soft);border:0;padding:6px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;cursor:pointer;transition:transform .12s}
.mcell .n{font-family:var(--f-disp);font-size:1rem;font-weight:600}
.mcell .m{font-size:.62rem;color:var(--muted);font-weight:800;text-transform:uppercase}
.mcell[data-l="2"]{background:var(--warm1)} .mcell[data-l="3"]{background:var(--warm2)} .mcell[data-l="4"]{background:var(--warm3)} .mcell[data-l="5"]{background:var(--warm4)}
.mcell.past{opacity:.4}
.mcell.today{box-shadow:0 0 0 3px var(--go)}
.mdots{display:flex;gap:3px;flex-wrap:wrap;min-height:7px}
.mdots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.list .d{background:var(--t,var(--soft));color:var(--c,var(--ink));border-radius:12px;padding:6px 8px;font-size:.8rem;font-weight:800;min-width:4.4rem;text-align:center}

/* barra in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar .in{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:26px;padding:6px;box-shadow:0 8px 30px rgb(33 29 59 / .14)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:.74rem;font-weight:800;color:var(--muted);cursor:pointer;border-radius:20px;transition:background .2s,color .2s}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--go);background:color-mix(in srgb,var(--go) 13%,transparent)}
.fab{position:fixed;z-index:11;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--go);color:var(--go-ink);cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--go) 45%,transparent);display:grid;place-items:center;transition:transform .12s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}

/* fogli */
.sheet-wrap{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgb(25 20 45 / .38);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
.sheet .x{position:sticky;top:0;align-self:flex-end;margin-bottom:-44px;z-index:2}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:800;color:var(--muted)}
.field input,.field select,.field textarea{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;font-size:16px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.check{display:flex;gap:12px;align-items:center;font-size:.96rem;background:var(--card);border-radius:16px;padding:12px 14px}
.check input{width:24px;height:24px;accent-color:var(--soc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem;cursor:pointer;min-height:40px;transition:transform .12s}
.chip[aria-pressed="true"]{background:var(--c,var(--go));color:#fff}
.closerow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--t);border-radius:16px;padding:10px 12px}
.closerow.gone{display:none}
.big-ok{font-family:var(--f-disp);font-size:2.6rem;font-weight:700;line-height:1;color:var(--ner)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* benvenuto */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.logo{width:84px;height:84px;border-radius:24px}
.welcome h1{font-size:2.3rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="welcome" class="welcome" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Ciao Niccolò,<br>questo è Ritmo.</h1>
  <p class="muted">La tua giornata in un colpo d'occhio: cosa fare adesso, cosa manca, domani, la settimana e il mese.</p>
  <form id="w-form" class="card" style="gap:12px">
    <div class="field"><label for="w-pass">Parola chiave dei tuoi dati</label><input id="w-pass" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="quattro parole con i trattini" required></div>
    <button class="btn go wide" type="submit">Entra</button>
    <p class="small muted" id="w-msg">La trovi nella chat con Claude. Si chiede una volta sola.</p>
  </form>
  <button class="btn ghost" id="w-skip" type="button">Inizia senza dati: solo la settimana tipo</button>
</div>

<div id="main" hidden>
<div class="app">
  <header class="top">
    <div><div class="hello" id="h-eye"></div><h1 id="h-title">…</h1><div class="week7" id="week7" aria-hidden="true"></div></div>
    <div class="top-r">
      <button class="pill" id="streak" type="button" aria-label="Serie di giornate chiuse"></button>
      <button class="iconbtn" id="gear" type="button" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </div>
  </header>
  <main id="view" style="display:flex;flex-direction:column;gap:14px"></main>
</div>

    h('div', { class: 'field' }, h('label', { for: 'cl-nota', text: 'Una riga per domani (facoltativa)' }), nota),
    h('button', { class: 'btn go wide', type: 'button', text: 'Chiudi la giornata', onclick: () => {
      patchDay(d, { chiusa: true, voto: voto || null, nota: nota.value.trim() });
      const n = streak(), tp = plan(addDays(d, 1));
      openSheet([xBtn(), h('span', { class: 'eyebrow', 'data-cat': 'nerina', text: 'Giornata chiusa' }), h('span', { class: 'big-ok', text: `${n} di fila` }), h('p', { class: 'muted', text: 'Conta le giornate chiuse, non quelle perfette.' }), h('div', { class: 'card' }, h('span', { class: 'eyebrow', text: 'Domani' }), h('p', { text: describe(tp) })), h('button', { class: 'btn go wide', type: 'button', text: 'Guarda domani', onclick: () => { closeSheet(); select('domani'); } })]);
    } })]);
}
function openSettings() {
  const ver = S.versione ? `Dati del piano: versione ${S.versione}` : 'Nessun dato del piano caricato';
  const ta = h('textarea', { id: 'bk', rows: 3, placeholder: 'Incolla qui un backup per ripristinarlo' });
  openSheet([xBtn(), h('h2', { text: 'Impostazioni' }),
    h('div', { class: 'card' }, h('b', { text: ver }), h('span', { class: 'small muted', text: 'Si aggiornano da soli quando apri l\'app con la rete. Claude li cambia quando gli dici «aggiorna Ritmo».' }),
      h('button', { class: 'btn', type: 'button', text: 'Aggiorna adesso', onclick: () => refresh(false) })),
    h('div', { class: 'card' }, h('b', { text: 'Backup delle tue spunte' }), h('span', { class: 'small muted', text: 'Spunte, energia, impegni aggiunti e sport restano solo su questo telefono. Copia un backup ogni tanto, per esempio nelle Note.' }),
      h('button', { class: 'btn', type: 'button', text: 'Copia il backup', onclick: async () => { try { await navigator.clipboard.writeText(lsGet(LS.stato) || '{}'); toast('Backup copiato'); } catch (e) { ta.value = lsGet(LS.stato) || '{}'; ta.select(); toast('Copialo dal riquadro'); } } }),
      h('div', { class: 'field' }, h('label', { for: 'bk', text: 'Ripristina' }), ta),
      h('button', { class: 'btn ghost', type: 'button', text: 'Ripristina questo backup', onclick: () => { try { const x = JSON.parse(ta.value); if (!x || typeof x !== 'object' || !('giorni' in x)) throw 0; lsSet(LS.stato, ta.value); loadState(); rebuildEvents(); render(); closeSheet(); toast('Backup ripristinato'); } catch (e) { toast('Questo testo non è un backup di Ritmo'); } } })),
    h('button', { class: 'btn ghost', type: 'button', text: 'Cambia la parola chiave', onclick: () => { try { localStorage.removeItem(LS.pass); } catch (e) { /* niente */ } closeSheet(); showWelcome(); } })]);
}

/* ---------- navigazione ---------- */
const TABS = ['oggi', 'domani', 'settimana', 'mese'];
function select(t) {
  tab = TABS.includes(t) ? t : 'oggi';
  TABS.forEach((x) => $('#t-' + x).setAttribute('aria-selected', String(x === tab)));
  render(); window.scrollTo(0, 0);
}
TABS.forEach((t) => $('#t-' + t).addEventListener('click', () => select(t)));
$('#fab').addEventListener('click', () => openEvent(null));
$('#gear').addEventListener('click', openSettings);
$('#streak').addEventListener('click', () => { const L = nowLogical(); if ((S.giorni[L.date] || {}).chiusa) select('domani'); else openClose(); });
function render() {
  if ($('#main').hidden) return;
  const v = tab === 'domani' ? viewDomani() : tab === 'settimana' ? viewSettimana() : tab === 'mese' ? viewMese() : viewOggi();
  $('#view').replaceChildren(...v.filter(Boolean));
  renderStreak();
}
function startTab() {
  const hs = location.hash.slice(1);
  if (hs === 'sera') { select('oggi'); openClose(); return; }
  if (TABS.includes(hs)) { select(hs); return; }
  const L = nowLogical();
  select(L.min >= 21 * 60 + 30 && (S.giorni[L.date] || {}).chiusa ? 'domani' : 'oggi');
}
function showMain() { $('#welcome').hidden = true; $('#main').hidden = false; startTab(); }
function showWelcome() { $('#main').hidden = true; $('#welcome').hidden = false; $('#w-pass').value = ''; }
$('#w-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pass = $('#w-pass').value.trim().toLowerCase(); const msg = $('#w-msg');
  msg.textContent = 'Apro i tuoi dati…';
  try { const d = await fetchData(pass); lsSet(LS.pass, pass); lsSet(LS.dati, JSON.stringify(d)); applyData(d); showMain(); toast('Benvenuto in Ritmo'); }
  catch (err) { msg.textContent = err && err.message === 'rete' ? 'Non riesco a scaricare i dati: controlla la connessione.' : 'Parola chiave sbagliata: ricontrolla i trattini.'; }
});
$('#w-skip').addEventListener('click', () => { lsSet(LS.pass, ''); showMain(); });
window.addEventListener('hashchange', startTab);
setInterval(() => { if ($('#sheet').hidden) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if ($('#sheet').hidden) render(); refresh(true); } });

loadState(); loadCachedData(); rebuildEvents();
if (lsGet(LS.pass) === null) showWelcome(); else { showMain(); refresh(true); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
