<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ritmo</title>
<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2845" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ornrarv.css?v=2.6.1">
<style>
:root {
  /* Ritmo 2.1 · palette «Alba»: carta chiara, inchiostro blu notte al posto del nero, accento corallo vivo; di sera un blu notte al posto del grigio antracite */
  color-scheme: light dark;
  --bg: #FAF9F6; --bg2: #F1F1EC; --card: #FFFFFF; --sunk: #EEF0F2;
  --line: rgba(30, 42, 74, .13); --line2: rgba(30, 42, 74, .065);
  --ink: #1E2A4A; --ink2: #56617D; --ink3: #8B93A8;
  --sel: #2E4277; --sel-ink: #FFFFFF;
  --acc: #E2603F; --acc2: #CC4F30; --acc-soft: rgba(226, 96, 63, .11); --acc-ink: #FFFFFF;
  --ok: #3F9163; --bad: #C8304E;
  --shadow: 0 1px 2px rgba(30, 42, 74, .05), 0 4px 14px rgba(30, 42, 74, .06);
  --shadow2: 0 10px 30px rgba(30, 42, 74, .16), 0 2px 6px rgba(30, 42, 74, .08);
  --k-uni: #4A6FA5; --k-nerina: #3E8A63; --k-network: #7A62AD; --k-social: #C05A7D; --k-palestra: #B5832B; --k-karate: #2E8A8C; --k-altro: #6E85B8; --k-scadenza: #E2603F; --k-festa: #D08A2E; --k-ricorrenza: #A0559A;
  --serif: 'Source Serif 4', 'Iowan Old Style', 'Palatino', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
  --r: 14px; --r2: 10px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1F2845; --bg2: #242E4E; --card: #2A3558; --sunk: #232C4B;
    --line: rgba(214, 224, 255, .14); --line2: rgba(214, 224, 255, .07);
    --ink: #F3F5FC; --ink2: #C3CBE3; --ink3: #8E98B8;
    --sel: #DCE4FF; --sel-ink: #1F2845;
    --acc: #FF8C6B; --acc2: #FFA287; --acc-soft: rgba(255, 140, 107, .17); --acc-ink: #1F2238;
    --ok: #7DD3A0; --bad: #FF7F93;
    --shadow: 0 1px 2px rgba(6, 10, 30, .25), 0 4px 14px rgba(6, 10, 30, .22);
    --shadow2: 0 12px 34px rgba(6, 10, 30, .5), 0 2px 6px rgba(6, 10, 30, .3);
    --k-uni: #8DB0EC; --k-nerina: #74CC9C; --k-network: #B29DF0; --k-social: #F293B6; --k-palestra: #EBBE66; --k-karate: #62CFCF; --k-altro: #A3B6E6; --k-scadenza: #FF8C6B; --k-festa: #F2B45E; --k-ricorrenza: #E3A0D8;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-weight: 500; }
.serif { font-family: var(--serif); }
.muted { color: var(--ink2); } .faint { color: var(--ink3); }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.ih { display: inline-flex; align-items: center; gap: 6px; }
[data-cat] { --k: var(--k-altro); }
[data-cat="uni"] { --k: var(--k-uni); } [data-cat="nerina"] { --k: var(--k-nerina); } [data-cat="network"] { --k: var(--k-network); } [data-cat="social"] { --k: var(--k-social); }
[data-cat="palestra"] { --k: var(--k-palestra); } [data-cat="karate"] { --k: var(--k-karate); } [data-cat="scadenza"] { --k: var(--k-scadenza); } [data-cat="festa"] { --k: var(--k-festa); } [data-cat="ricorrenza"] { --k: var(--k-ricorrenza); }

/* ---------- ingresso ---------- */
.welcome { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: calc(40px + var(--safe-t)) 24px 40px; max-width: 460px; margin: 0 auto; }
.welcome .logo { width: 64px; height: 64px; border-radius: 16px; box-shadow: var(--shadow); }
.welcome h1 { font-family: var(--serif); font-size: 32px; line-height: 1.12; letter-spacing: -.01em; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lab { font-size: 13px; font-weight: 600; color: var(--ink2); }
.in { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: var(--r2); padding: 12px 13px; font-size: 16px; outline: none; transition: border-color .15s; }
.in:focus { border-color: var(--acc); }
.in.sm { padding: 9px 11px; font-size: 15px; width: auto; }

/* ---------- bottoni ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 15px; background: var(--sunk); color: var(--ink); transition: transform .12s var(--ease), background .15s, opacity .15s; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--acc); color: var(--acc-ink); }
.btn.pri:active { background: var(--acc2); }
.btn.line { background: transparent; border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--ink2); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn .ic { font-size: 18px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, color .15s; }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.chip.free { border-style: dashed; }
.seg { display: flex; background: var(--sunk); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 34px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

/* ---------- struttura ---------- */
#app { min-height: 100vh; padding-bottom: calc(96px + var(--safe-b)); overflow-x: hidden; overflow-x: clip; }
#view { display: flex; flex-direction: column; will-change: transform; }
.wrap { padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); box-shadow: var(--shadow); }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 2px 0; }
.sect-h h2 { font-family: var(--serif); font-size: 21px; letter-spacing: -.005em; }
.sect-h small { color: var(--ink3); font-size: 13px; }

/* ---------- testata con il paesaggio del mese ---------- */
/* il disegno sfuma nel colore della pagina: niente stacco netto tra la testata e il pannello sotto (2.3) */
.hero { position: relative; height: max(calc(280px + var(--safe-t)), 44vh); overflow: hidden; background: var(--bg); color: var(--h-ink, #fff); margin-bottom: -6px; }
.hero.short { height: max(calc(280px + var(--safe-t)), 44vh); }
.hero .scene, .hero::after, .hero::before { -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 70px), rgba(0,0,0,.55) calc(100% - 30px), transparent 100%); mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 70px), rgba(0,0,0,.55) calc(100% - 30px), transparent 100%); }
.hero::before { content: ''; position: absolute; inset: 0; background: var(--h-bg, #232B3B); }
.hero .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--h-scrim) 0%, transparent 62%), linear-gradient(0deg, var(--h-scrim2) 22%, transparent 58%); pointer-events: none; }
.hero .bar { position: absolute; top: calc(8px + var(--safe-t)); left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; z-index: 2; }
.hero .bar .sp { flex: 1; }
.hbtn { height: 34px; min-width: 34px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600;
  background: color-mix(in srgb, var(--h-bg) 55%, transparent); color: var(--h-ink); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); border: 1px solid color-mix(in srgb, var(--h-ink) 14%, transparent); }
.hbtn .ic { font-size: 17px; }
.hbtn.round { padding: 0; width: 34px; }
.hero .ht { position: absolute; left: 18px; right: 18px; bottom: 52px; z-index: 2; display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 12px var(--h-scrim); }
.hero .kick { font-size: 13px; font-weight: 600; letter-spacing: .02em; opacity: .85; }
.hero h1 { font-family: var(--serif); font-size: 38px; line-height: 1.04; letter-spacing: -.015em; font-weight: 500; }
.hero.short h1 { font-size: 30px; }
.hero .hs { font-size: 14px; opacity: .88; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.code { display: inline-flex; gap: 1px; font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.code i { font-style: normal; opacity: .55; }

/* ---------- striscia della settimana settale ---------- */
.wstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 12px 2px; }
.wstrip button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 8px; border-radius: 12px; position: relative; transition: background .15s; }
.wstrip .l { font-size: 12px; font-weight: 700; color: var(--ink3); letter-spacing: .04em; }
.wstrip .n { font-family: var(--serif); font-size: 19px; line-height: 1; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: lining-nums tabular-nums; }
.wstrip .d { height: 5px; display: flex; gap: 2px; }
.wstrip .d i { width: 5px; height: 5px; border-radius: 50%; background: var(--k); }
.wstrip button.today .n { color: var(--acc); font-weight: 600; }
.wstrip button[aria-pressed="true"] .n { background: var(--sel); color: var(--sel-ink); }
.wstrip button.today[aria-pressed="true"] .n { background: var(--acc); color: var(--acc-ink); }
.wstrip button.past .n { color: var(--ink3); }

/* ---------- riquadro del messaggio ---------- */
.focus { display: flex; gap: 12px; align-items: center; padding: 13px 14px; }
.focus .fi { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); font-size: 20px; flex: none; }
.focus .fi[data-tone="ok"] { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.focus .fi[data-tone="calm"] { background: var(--sunk); color: var(--ink2); }
.focus .ft { flex: 1; min-width: 0; }
.focus .ft b { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.focus .ft span { display: block; color: var(--ink2); font-size: 13.5px; margin-top: 1px; }
.focus .btn { flex: none; }

/* ---------- anteprima della giornata ---------- */
.pv { overflow: hidden; }
.pv-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; text-align: left; }
.pv-h .pv-ic { width: 30px; height: 30px; border-radius: 9px; background: var(--sunk); display: grid; place-items: center; font-size: 17px; color: var(--ink2); flex: none; }
.pv-h b { font-family: var(--serif); font-size: 18px; font-weight: 500; }
.pv-h .pv-s { color: var(--ink3); font-size: 13px; flex: 1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-h .chev { font-size: 16px; color: var(--ink3); transition: transform .25s var(--ease); }
.pv.open .pv-h .chev { transform: rotate(90deg); }
.pv-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s var(--ease); }
.pv.open .pv-b { grid-template-rows: 1fr; }
.pv-b > div { overflow: hidden; }
.pv-in { padding: 2px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.pv-top { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
.clock { width: 150px; height: 150px; display: block; }
.clock .tk { stroke: var(--line); }
.clock text { fill: var(--ink3); font-size: 9px; font-weight: 600; font-family: var(--sans); }
.stats { display: flex; flex-direction: column; gap: 9px; }
.stat { display: flex; flex-direction: column; }
.stat small { font-size: 12px; color: var(--ink3); font-weight: 600; }
.stat b { font-size: 15px; font-weight: 600; }
.stat b.big { font-family: var(--serif); font-size: 26px; font-weight: 500; line-height: 1.05; }
.mixbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--sunk); gap: 2px; }
.mixbar i { background: var(--k); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--ink2); margin-top: 7px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend span::before { content: ''; width: 8px; height: 8px; border-radius: 3px; background: var(--k); }
.phase { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--sunk); }
.phase .lilw { width: 54px; height: 54px; flex: none; }
.phase b { display: block; font-weight: 600; }
.phase span { font-size: 13.5px; color: var(--ink2); }
.pv-list { display: flex; flex-direction: column; gap: 8px; }
.pv-row { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.pv-row .ic { font-size: 17px; color: var(--ink3); margin-top: 1px; }
.pv-row b { font-weight: 600; }
.pv-row ul { margin: 3px 0 0; padding-left: 16px; color: var(--ink2); }
.freebar { position: relative; height: 26px; border-radius: 8px; background: var(--sunk); overflow: hidden; }
.freebar i { position: absolute; top: 0; bottom: 0; background: var(--k); opacity: .85; }
.freebar i.sleep { background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 7px); opacity: 1; }
.freebar i.now { width: 2px; background: var(--acc); opacity: 1; }
.freebar-l { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink3); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* ---------- agenda: tutto il giorno, da fissare, orario in scala ---------- */
.allday { display: flex; flex-wrap: wrap; gap: 6px; }
.adchip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 9px; border-radius: 9px; font-size: 13.5px; font-weight: 500;
  background: color-mix(in srgb, var(--k) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--k) 25%, transparent); }
.adchip .ic { color: var(--k); font-size: 15px; }
.todo { display: flex; flex-direction: column; gap: 6px; }
.todo-h { font-size: 13px; font-weight: 600; color: var(--ink2); }
.grid { position: relative; margin: 0 0 0 46px; touch-action: pan-y; }
.grid .hr { position: absolute; left: -46px; right: 0; height: 0; border-top: 1px solid var(--line2); }
.grid .hr span { position: absolute; left: 0; top: -8px; width: 38px; text-align: right; font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.grid .night { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--line2) 0 4px, transparent 4px 10px); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink3); font-size: 12.5px; gap: 6px; z-index: 1; }
.grid .night.real { background: color-mix(in srgb, var(--sel) 9%, transparent); border: 1px solid color-mix(in srgb, var(--sel) 22%, transparent); color: var(--ink2); font-weight: 600; }
.grid .night.run { background: color-mix(in srgb, var(--sel) 14%, transparent); border: 1.5px solid color-mix(in srgb, var(--sel) 45%, transparent); color: var(--ink); animation: runpulse 2.4s ease-in-out infinite; }
.oblist { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.oblist button { display: flex; align-items: flex-start; gap: 8px; text-align: left; width: 100%; padding: 4px 0; color: var(--ink2); font-size: 14px; line-height: 1.3; }
.oblist .ob-i { width: 16px; height: 16px; flex: none; display: grid; place-items: center; margin-top: 1px; }
.oblist .ob-i::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--k, var(--ink2)); }
.oblist .done .ob-i { border-radius: 50%; background: var(--ok); color: #fff; }
.oblist .done .ob-i::before { display: none; }
.oblist .done .ob-i .ic { font-size: 12px; stroke-width: 3; }
.oblist .done span:last-child { color: var(--ink3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink3) 60%, transparent); }
.oblist small { color: var(--ink3); }
.grid .gap { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink3); font-size: 13px; border-radius: 10px; transition: background .15s, color .15s; }
.grid .gap:active, .grid .gap.hot { background: var(--acc-soft); color: var(--acc); }
.grid .gap .ic { font-size: 15px; }
.grid .nowl { position: absolute; left: -6px; right: 0; height: 0; border-top: 2px solid var(--acc); z-index: 4; pointer-events: none; }
.grid .nowl::before { content: ''; position: absolute; left: -4px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
.grid .nowl span { position: absolute; left: -50px; top: -9px; width: 40px; text-align: right; font-size: 11.5px; font-weight: 700; color: var(--acc); background: var(--bg); }
.blk { position: absolute; left: 0; right: 0; border-radius: 10px; padding: 6px 40px 6px 12px; overflow: hidden; z-index: 2;
  background: color-mix(in srgb, var(--k) 13%, var(--card)); border: 1px solid color-mix(in srgb, var(--k) 26%, transparent);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: transform .2s var(--ease), opacity .2s, box-shadow .2s; }
.blk::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k); }
.blk .bt { font-weight: 600; font-size: 14.5px; line-height: 1.25; display: flex; gap: 6px; align-items: center; }
.blk .bt .ic { color: var(--k); font-size: 15px; }
.blk .bt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk .bs { font-size: 12.5px; color: var(--ink2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.blk.xs { padding-top: 2px; padding-bottom: 2px; display: flex; align-items: center; gap: 8px; }
.blk.xs .bs { margin: 0; }
.blk.done { opacity: .62; }
.blk.done .bt span { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink) 40%, transparent); }
.blk .ck { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; border: 1.8px solid color-mix(in srgb, var(--k) 70%, var(--ink3)); display: grid; place-items: center; color: transparent; font-size: 15px; background: var(--card); }
.blk.done .ck { background: var(--k); border-color: var(--k); color: #fff; }
.blk.pressing { transform: scale(.98); }
.blk.lifted { opacity: .25; }
.blk.flash { animation: flash 1.2s var(--ease); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--acc); } 40% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--acc) 35%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.blk.sel { box-shadow: 0 0 0 2px var(--k); z-index: 5; overflow: visible; }
.blk .hd { display: none; position: absolute; left: 50%; width: 46px; height: 22px; margin-left: -23px; z-index: 6; touch-action: none; }
.blk .hd::after { content: ''; position: absolute; left: 11px; right: 11px; top: 8px; height: 6px; border-radius: 4px; background: var(--card); border: 2px solid var(--k); }
.blk .hd.t { top: -11px; } .blk .hd.b { bottom: -11px; }
.blk.sel .hd { display: block; }
.blk.clash { border-color: var(--bad); }
.blk.run { border-color: var(--k); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--k) 55%, transparent); }

<script>
(() => {
'use strict';
/* ==== NUCLEO di Ritmo v2 (copiato nel widget da strumenti/costruisci_widget.py: niente DOM qui dentro) ==== */
/* Tempo */
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const dowOf = (s) => parseISO(s).getDay();
const dayDiff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const mondayOf = (s) => addDays(s, -((dowOf(s) + 6) % 7));
const toMin = (t, after) => { if (!t) return null; const [hh, mm] = String(t).split(':').map(Number); let v = hh * 60 + (mm || 0); if (after != null && v <= after) v += 1440; return v; };
const fmt = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return Math.floor(m / 60) + ':' + pad(m % 60); };
const hm = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const dur = (m) => { m = Math.round(m); const hh = Math.floor(m / 60), r = m % 60; return hh ? (r ? `${hh}h${pad(r)}` : `${hh}h`) : `${r} min`; };
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const WD = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const MOS = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
/* Il giorno "logico" finisce alle 4 di notte: a mezzanotte e mezza è ancora oggi. */
function nowLogical() { const n = new Date(); const l = new Date(n.getTime() - 4 * 3600e3); return { date: iso(l), min: n.getHours() * 60 + n.getMinutes() + (n.getHours() < 4 ? 1440 : 0), hour: n.getHours() }; }

/* Calendario settale ORNRARV: dal lunedì 21 settembre 2026, 7 mesi x 7 settimane x 7 giorni. */
const ORN_START = '2026-09-21', SEQ = 'ORNRARV';
const MESI = ['Foliaio', 'Brumale', 'Ianuario', 'Germinale', 'Floreale', 'Messidoro', 'Estiario'];
const FASI = { O: 'Osservare', R: 'Remare', N: 'Navigare', A: 'Automatizzare', V: 'Validare' };
function settale(date) {
  const n = dayDiff(ORN_START, date); if (n < 0 || n >= 343) return null;
  const mi = Math.floor(n / 49), r = n % 49, wi = Math.floor(r / 7), di = r % 7;
  return { n, mi, wi, di, num: r + 1, mese: MESI[mi], l: SEQ[di], wl: SEQ[wi], ml: SEQ[mi], code: `${SEQ[mi]}.${SEQ[wi]}.${SEQ[di]}`, fase: FASI[SEQ[di]], sett: FASI[SEQ[wi]],
    first: addDays(ORN_START, mi * 49), weekStart: addDays(ORN_START, mi * 49 + wi * 7) };
}
const gWD = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];
const dLetter = (d) => { const o = settale(d); return o ? o.l : gWD[dowOf(d)]; };
const dNum = (d) => { const o = settale(d); return o ? o.num : parseISO(d).getDate(); };
const dTitle = (d) => { const o = settale(d); return o ? `${o.num} ${o.mese}` : `${parseISO(d).getDate()} ${MOS[parseISO(d).getMonth()]}`; };
const greg = (d) => { const x = parseISO(d); return `${pad(x.getDate())}/${pad(x.getMonth() + 1)}`; };
function relWord(d, today) { const k = dayDiff(today, d); return k === 0 ? 'Oggi' : k === 1 ? 'Domani' : k === -1 ? 'Ieri' : cap(WD[dowOf(d)]); }
/* Alba e tramonto a Erbusco (lat 45,6 · lon 10,0) con la formula della NOAA: minuti dalla mezzanotte, ora locale. Errore di qualche minuto. */
function sunTimes(d, lat = 45.6, lon = 9.97) {
  const x = parseISO(d), N = Math.round((x - new Date(x.getFullYear(), 0, 0)) / 864e5), g = 2 * Math.PI / 365 * (N - .5);
  const eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
  const dc = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g) - .002697 * Math.cos(3 * g) + .00148 * Math.sin(3 * g);
  const la = lat * Math.PI / 180, ha = Math.acos(Math.cos(90.833 * Math.PI / 180) / (Math.cos(la) * Math.cos(dc)) - Math.tan(la) * Math.tan(dc)) * 180 / Math.PI;
  const tz = -new Date(x.getFullYear(), x.getMonth(), x.getDate(), 12).getTimezoneOffset();
  return [Math.round(720 - 4 * (lon + ha) - eq + tz), Math.round(720 - 4 * (lon - ha) - eq + tz)];
}
/* Paesaggio: di giorno dall'alba al tramonto, di notte il resto (o fisso dalle Impostazioni). Vale per tutti i mesi. */
function variantFor(mi, when, pr) {
  if (pr === 'giorno' || pr === 'notte') return pr;
  const t = when instanceof Date ? when : new Date(), m = t.getHours() * 60 + t.getMinutes(), [a, b] = sunTimes(iso(t));
  return m >= a && m < b ? 'giorno' : 'notte';
}

/* Categorie degli impegni */
const CATS = {
  uni: { n: 'Uni', ic: 'uni', min: 120, sym: 'graduationcap' },
  nerina: { n: 'Nerina', ic: 'nerina', min: 120, sym: 'leaf' },
  network: { n: 'Network', ic: 'rete', min: 60, sym: 'point.3.connected.trianglepath.dotted' },
  social: { n: 'Social', ic: 'persone', min: 120, sym: 'person.2' },
  palestra: { n: 'Palestra', ic: 'pesi', min: 90, sym: 'dumbbell' },
  karate: { n: 'Karate', ic: 'karate', min: 120, sym: 'figure.martial.arts' },
  altro: { n: 'Altro', ic: 'impegno', min: 60, sym: 'calendar' },
  scadenza: { n: 'Scadenza', ic: 'bandiera', min: 0, sym: 'flag' },
  festa: { n: 'Festa', ic: 'festa', min: 0, sym: 'sparkles' },
  ricorrenza: { n: 'Ricorrenza', ic: 'regalo', min: 0, sym: 'gift' }
};
const NEW_CATS = ['uni', 'nerina', 'network', 'social', 'palestra', 'karate'];
const CAT_COL = { uni: '#4A6FA5', nerina: '#3E8A63', network: '#7A62AD', social: '#C05A7D', palestra: '#B5832B', karate: '#2E8A8C', altro: '#6E85B8', scadenza: '#E2603F', festa: '#D08A2E', ricorrenza: '#A0559A' };
const CAT_COL_DARK = { uni: '#8DB0EC', nerina: '#74CC9C', network: '#B29DF0', social: '#F293B6', palestra: '#EBBE66', karate: '#62CFCF', altro: '#A3B6E6', scadenza: '#FF8C6B', festa: '#F2B45E', ricorrenza: '#E3A0D8' };
/* Vecchi tipi della v1 riportati alle categorie nuove */
const LEGACY = { scuola: 'uni', studio: 'uni', lavoro: 'nerina', sociale: 'social', persone: 'social', promemoria: 'scadenza' };
const catOf = (e) => { const t = LEGACY[e.tipo] || e.tipo; return CATS[t] ? t : 'altro'; };
const isAllDay = (e) => !e.inizio && !e.flessibile;

/* Stato: S.file = dati del file cifrato, S.miei = impegni aggiunti sul telefono, S.giorni = spunte, piano e umore per giorno */
const S = { file: [], miei: [], nascosti: [], giorni: {}, nerina: {}, cfg: null, versione: null, eventi: [], pref: {}, soldi: { base: 0, mov: [] } };
const PREF0 = { sveglia: '08:30', letto: '00:00', paesaggio: 'auto', avviso: 10, sera: '21:30' };
const pref = () => ({ ...PREF0, ...((S.cfg && S.cfg.sonno) || {}), ...S.pref });
/* 2.6: ricorrenze e feste messe dal telefono con «ogni anno» (ogni: 'anno') compaiono anche nei tre anni dopo; le copie hanno orig = id dell'originale */
const yearly = (e) => { if (e.ogni !== 'anno') return [e]; const [y, m, d] = e.data.split('-').map(Number);
  return [0, 1, 2, 3].map((k) => { const dd = m === 2 && d === 29 && (y + k) % 4 ? 28 : d; return k ? { ...e, data: `${y + k}-${pad(m)}-${pad(dd)}`, id: e.id + '~' + (y + k), orig: e.id } : e; }); };
const rebuildEvents = () => { const hid = new Set(S.nascosti); S.eventi = [...S.file.filter((e) => !hid.has(e.id)).map((e) => ({ ...e, src: 'file' })), ...S.miei.flatMap(yearly).map((e) => ({ ...e, src: 'mio' }))]; };
const evKey = (e) => 'e:' + e.id;
const dayRec = (d) => S.giorni[d] || {};
const isPlanned = (d) => !!dayRec(d).pianificato;
const isDone = (d, e) => !!(dayRec(d).fatti || {})[evKey(e)];
/* Sveglia e ora di andare a letto del giorno (si possono cambiare per un giorno solo mentre lo si pianifica) */
/* Il sonno vero: S.giorni[n].sonno = { s: quando sei andato a letto la notte di n, e: quando ti sei svegliato (null = dormi ancora), stima: ora di letto stimata }.
   Come i blocchi: la sveglia vera sposta l'inizio della giornata dopo, l'ora vera di letto ne sposta la fine; finché dormi la notte si allunga con l'orologio. */
const SLEEP_MAX = 16 * 3600e3;
const sleepOn = (n) => { const z = dayRec(n).sonno; return z && z.s ? z : null; };
const sleepRun = (z) => !!(z && !z.e && Date.now() - z.s < SLEEP_MAX);
function dayBounds(d) {
  const p = pref(), r = dayRec(d), pv = sleepOn(addDays(d, -1)), sl = sleepOn(d);
  let wake = toMin(r.sveglia || p.sveglia); const bed0 = toMin(r.letto || p.letto);
  let bed = bed0 <= wake ? bed0 + 1440 : bed0;
  const nowM = msMin(d, Date.now());
  if (pv && pv.e) wake = msMin(d, pv.e); else if (sleepRun(pv) && nowM > 0) wake = Math.max(wake, nowM);
  if (sl) bed = Math.max(wake + 30, msMin(d, sl.s));
  return { wake, bed, wakeReal: !!(pv && pv.e), sleptMin: pv && pv.e ? Math.round((pv.e - pv.s) / 60000) : null, stima: !!(pv && pv.stima), asleepAM: sleepRun(pv), bedReal: !!sl, asleepPM: sleepRun(sl) };
}
/* Iniziato / terminato: i tempi veri di un impegno, in S.giorni[d].corso[chiave] = { s: quando è iniziato, e: quando è finito (null = in corso) }.
   Finché è in corso il blocco parte dall'ora vera e si allunga con l'orologio; quando lo termini resta con la durata vera. */
const corsoOf = (d, e) => ((dayRec(d).corso || {})[evKey(e)]) || null;
const msMin = (d, ms) => Math.round((ms - parseISO(d).getTime()) / 60000);
/* Tutto quello che c'è in un giorno */
function dayModel(d) {
  const evs = S.eventi.filter((e) => e.data === d), nowM = msMin(d, Date.now());
  const timed = evs.filter((e) => e.inizio || (e.flessibile && corsoOf(d, e))).map((e) => {
    let s = e.inizio ? toMin(e.inizio) : 0, en = e.inizio && e.fine ? toMin(e.fine, s) : s + (Number(e.durata) || 60);
    const plan = e.inizio ? [s, en] : null, c = corsoOf(d, e), len = Math.max(5, en - s);
    if (c) { s = msMin(d, c.s); en = c.e ? Math.max(s + 1, msMin(d, c.e)) : Math.max(s + len, Math.min(nowM, 1680)); }
    return { key: evKey(e), ev: e, cat: catOf(e), title: e.titolo, dove: e.dove || '', start: s, end: en, done: isDone(d, e), run: !!(c && !c.e), real: !!c, plan };

setInterval(() => { if (!$('#sheet').hidden || DRAG || RS || WDRAG) return; const L = nowLogical(); if (L.date !== lastDay) { if (dayD === lastDay) dayD = L.date; lastDay = L.date; } render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if ($('#sheet').hidden && !DRAG) { heroKey = ''; render(); } refresh(true); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

/* se il telefono ha tenuto una grafica vecchia insieme all'app nuova, svuoto la cache e ricarico (una volta) */
if (window.ORN && ORN.version !== '2.6.1') { try { if (!sessionStorage.getItem('ritmo:rl')) { sessionStorage.setItem('ritmo:rl', '1'); (window.caches ? caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))) : Promise.resolve()).then(() => location.reload()); } } catch (e) { /* niente */ } }
loadState(); loadCachedData(); rebuildEvents();
if (lsGet(LS.pass) === null) showWelcome(); else { showMain(); refresh(true); }
if ('serviceWorker' in navigator) {
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded && $('#sheet').hidden) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then((r) => r.update()).catch(() => {});
}
})();
